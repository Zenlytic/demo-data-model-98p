version: 1
type: view
name: ltv
description: >-
  Monthly customer lifetime value (LTV) snapshot for Pure Organics. Each row
  captures a customer's activity in a given month, including the number of
  customers and orders in the month, cumulative orders to date and gross sales.
  Use it to analyze customer lifetime value, order cadence and loyalty over
  time.
model_name: pure_organics
sql_table_name: DEMO_PROD.LTV
default_date: activity
row_label: Customer Month
identifiers:
- name: ltv_key
  type: primary
  sql: ${ltv_key}
fields:
- name: ltv_key
  field_type: dimension
  type: string
  hidden: true
  primary_key: true
  description: Unique key for a customer and month.
  sql: concat(${TABLE}.CUSTOMER_ID, '-', ${TABLE}.DATE_MONTH)
  searchable: false

- name: customer_id
  field_type: dimension
  type: string
  description: >-
    Unique identifier for a customer in the database, used to track and analyze
    individual customer behavior and transactions.
  sql: ${TABLE}.CUSTOMER_ID
  searchable: false

- name: n_customers_in_month
  field_type: dimension
  type: number
  hidden: true
  description: The number of new customers acquired by the company in a given month.
  sql: ${TABLE}.N_CUSTOMERS_IN_MONTH
  searchable: false

- name: n_orders_in_month
  field_type: dimension
  type: number
  hidden: true
  description: The number of orders a customer places within a month.
  sql: ${TABLE}.N_ORDERS_IN_MONTH
  searchable: false

- name: n_cumulative_orders
  field_type: dimension
  type: number
  description: >-
    The total number of orders a customer has placed up to a certain point in
    time, used to measure customer loyalty and purchasing behavior over time.
  sql: ${TABLE}.N_CUMULATIVE_ORDERS
  searchable: false

- name: gross_sales
  field_type: dimension
  type: number
  hidden: true
  description: >-
    The total revenue generated from sales before any deductions or
    adjustments, representing the initial amount received from customers.
  sql: ${TABLE}.GROSS_SALES
  searchable: false

- name: activity
  field_type: dimension_group
  type: time
  datatype: date
  label: Month
  description: >-
    The month in which a customer's activity is being measured, allowing for
    analysis of customer lifetime value over time (source column DATE_MONTH).
  timeframes:
  - raw
  - date
  - month
  - quarter
  - year
  sql: ${TABLE}.DATE_MONTH

- name: total_customers_in_month
  field_type: measure
  type: sum
  description: Total number of new customers acquired in the selected months.
  sql: ${n_customers_in_month}

- name: total_orders_in_month
  field_type: measure
  type: sum
  description: Total number of orders placed in the selected months.
  sql: ${n_orders_in_month}

- name: total_gross_sales
  field_type: measure
  type: sum
  description: Total gross sales (before deductions or adjustments) in the selected months.
  sql: ${gross_sales}

- name: count_customers
  field_type: measure
  type: count_distinct
  description: Number of distinct customers with activity in the selected months.
  sql: ${customer_id}
