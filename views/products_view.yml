version: 1
type: view
name: products
model_name: pure_organics
sql_table_name: DEMO_PROD.PRODUCTS
default_date: order_lines.order
identifiers:
- name: product_id
  type: primary
  sql: ${product_id}
fields:
- name: product_id
  field_type: dimension
  type: string
  hidden: true
  primary_key: true
  description: The id of the product.
  sql: ${TABLE}.PRODUCT_ID
  zoe_description: The id of the product.
  searchable: false

- name: product_type
  field_type: dimension
  type: string
  description: 'The type of the product sold (Eye, Lip, Face, etc) '
  sql: ${TABLE}.PRODUCT_TYPE
  searchable: true
  zoe_description: 'The type of the product. '

- name: product_title
  field_type: dimension
  type: string
  description: The title of the product sold (Everyday SPF Cream, etc)
  sql: ${TABLE}.PRODUCT_TITLE
  tags:
  - product
  searchable: true

- name: price
  field_type: dimension
  type: string
  description: The Price of the Product
  sql: ${TABLE}.PRICE
  searchable: true
